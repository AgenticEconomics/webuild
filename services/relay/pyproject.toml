[project]
name = "webuild-relay"
version = "0.1.0"
description = "WeBuild Relay Server — ACP bridge between Web IDE browsers and local WeBuild Agent instances"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "httpx>=0.27",
    "webuild-shared",
]

[tool.uv.sources]
webuild-shared = { path = "../shared", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
