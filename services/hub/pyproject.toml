[project]
name = "webuild-hub"
version = "0.1.0"
description = "WeBuild Hub Broker - routes tool calls between ToolServer and ToolHarness via JSON-RPC 2.0 over WebSocket"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "webuild-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
