# Local development overrides — no TLS, no Nginx, direct port access
# Usage: docker compose up (auto-loads both files)

services:
  # Disable production-only services
  nginx:
    profiles: ["production"]

  certbot:
    profiles: ["production"]

  # Use local images
  auth-service:
    image: webuild-auth:local
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://webuild:devpass@postgres:5432/webuild
      - JWT_SECRET=dev-secret-key-not-for-production
      - INVITE_EMAIL=jerry.zhang@datoms.cn
      - INVITE_WHITELIST_PATH=/run/secrets/invite_whitelist
    secrets:
      - invite_whitelist

  relay-server:
    image: webuild-relay:local
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://webuild:devpass@postgres:5432/webuild
      - JWT_SECRET=dev-secret-key-not-for-production
      - RELAY_INTERNAL_TOKEN=webuild-internal-agent-token-2026

  hub-broker:
    image: webuild-hub:local
    ports:
      - "8003:8003"

  agent:
    image: webuild-agent:local
    environment:
      - RELAY_URL=ws://relay-server:8002/ws
      - RELAY_INTERNAL_TOKEN=webuild-internal-agent-token-2026
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - MODEL=${MODEL:-qwen-max}

  gateway:
    image: webuild-gateway:local
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://webuild:devpass@postgres:5432/webuild
      - JWT_SECRET=dev-secret-key-not-for-production
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - MODEL=${MODEL:-qwen-max}
      # Public WSS — ACS NetworkPolicy only allows TCP/443 egress
      - RELAY_URL=wss://webuild.datoms.cn/ws/relay
      - RELAY_INTERNAL_TOKEN=webuild-internal-agent-token-2026
      - HUB_WS_URL=wss://webuild.datoms.cn/ws/hub
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-xingu-aliyun-acr-registry.cn-hangzhou.cr.aliyuncs.com/webuild/sandbox:latest}
      - SANDBOX_AGENT=${SANDBOX_AGENT:-webuild}
      - WEBUILD_YOLO=1
    volumes:
      - ../sandbox:/app/sandbox:ro
    profiles: ["sandbox"]

  web-ide:
    image: webuild-web-ide:local
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=devpass
